name: Feature request
description: Propose new or changed behaviour, starting from the problem with the current workflow.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. If a field is unknown, say **Unknown — why, and how to find out**. Mark any mockup as a proposal, not an observation.
  - type: textarea
    id: problem
    attributes:
      label: User problem and current workflow
      description: Who is trying to do what, how they do it today, and where it hurts. Screenshots of existing friction help.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: What the user should be able to do and observe instead. Use terms from GLOSSARY.md.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Concrete example
      description: One realistic input or scenario and the result you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds and why they fall short.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and developer notes
      description: What is in and out of scope, constraints, related issues or ADRs, hypotheses (labelled), and remaining unknowns.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One unchecked, observable pass/fail criterion for every desired behaviour above, reachable through the product's own interface.
      value: "- [ ] "
    validations:
      required: true
