name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install workflow and secret scanners
        run: bash scripts/install_ci_quality_tools.sh
      - name: Install Python
        run: uv python install
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Run all checks
        run: uv run --locked pre-commit run --all-files
      - name: Test optional CatBoost training path
        run: uv run --locked --extra training pytest -q tests/test_failure_prediction.py
      - name: Audit Python dependencies
        run: uv --preview-features audit-command audit --locked
      - name: Audit npm dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Audit workflow security
        run: uvx zizmor==1.30.1 --collect=workflows .
      - name: Scan Git history for secrets
        run: gitleaks git . --redact --no-banner
