name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.18"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install workflow and secret scanners
        run: bash scripts/install_ci_quality_tools.sh
      - name: Install Python
        run: uv python install
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Install Chromium
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Run all checks
        run: uv run --locked pre-commit run --all-files
      - name: Test optional CatBoost training path
        run: uv run --locked --extra training pytest -q tests/test_failure_prediction.py
      - name: Audit Python dependencies
        run: uv --preview-features audit-command audit --locked
      - name: Audit npm dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Audit workflow security
        run: uvx zizmor==1.30.1 --collect=workflows .
      - name: Scan Git history for secrets
        run: gitleaks git . --redact --no-banner
