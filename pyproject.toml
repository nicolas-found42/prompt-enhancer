[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-enhancer"
version = "0.1.0"
description = "A local, Jev-powered prompt optimizer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
training = [
  "catboost>=1.2.10,<2",
]

[project.scripts]
prompt-enhancer = "prompt_enhancer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx>=0.27",
    "hypothesis>=6.168.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["prompt_enhancer"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
